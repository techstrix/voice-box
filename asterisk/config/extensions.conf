[incoming-calls]
; VoiceBox AI loop: record caller -> FastAGI backend (host venv) -> play reply.
; AGI server: backend/agi_server.py (agi://host.docker.internal:4573/voice).
; Needs `dialplan reload` after editing.
exten => 1001,1,NoOp(Incoming call for Company A)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(custom/welcome_${EXTEN})
 same => n,Playback(custom/beep_tone)
 same => n,Record(/var/lib/asterisk/sounds/custom/in_${UNIQUEID}.wav,0,10,kq)
 same => n,AGI(agi://host.docker.internal:4573/voice,${EXTEN},${UNIQUEID})
 same => n,GotoIf($["${VB_STATUS}" != "ok"]?hang)
 same => n,Playback(custom/${VB_REPLY})
 same => n(hang),Hangup()

exten => 1002,1,NoOp(Incoming call for Company B)
