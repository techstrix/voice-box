[incoming-calls]
; VoiceBox AI loop: record caller -> FastAGI backend (host venv) -> play reply.
; AGI server: backend/agi_server.py (agi://host.docker.internal:4573/voice).
; Needs `dialplan reload` after editing.
exten => 1001,1,NoOp(Incoming call for Company A)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(custom/welcome_${EXTEN})
 same => n,Playback(custom/beep_tone)
 same => n,Record(/var/lib/asterisk/sounds/custom/in_${UNIQUEID}.wav,0,10,kq)
 same => n,Set(WAITCOUNT=0)
 same => n,AGI(agi://host.docker.internal:4573/voice,start,${EXTEN},${UNIQUEID})
 same => n(vbloop),Playback(custom/thinking)
 same => n,AGI(agi://host.docker.internal:4573/voice,check,${EXTEN},${UNIQUEID})
 same => n,GotoIf($["${VB_STATUS}" = "ok"]?vbdone)
 same => n,Set(WAITCOUNT=$[${WAITCOUNT} + 1])
 same => n,GotoIf($[${WAITCOUNT} > 7]?vbtimeout)
 same => n,Goto(vbloop)
 same => n(vbtimeout),Playback(custom/timeout)
 same => n,Hangup()
 same => n(vbdone),Playback(custom/${VB_REPLY})
 same => n,Hangup()

exten => 1002,1,NoOp(Incoming call for Company B)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(custom/welcome_${EXTEN})
 same => n,Playback(custom/beep_tone)
 same => n,Record(/var/lib/asterisk/sounds/custom/in_${UNIQUEID}.wav,0,10,kq)
 same => n,Set(WAITCOUNT=0)
 same => n,AGI(agi://host.docker.internal:4573/voice,start,${EXTEN},${UNIQUEID})
 same => n(vbloop),Playback(custom/thinking)
 same => n,AGI(agi://host.docker.internal:4573/voice,check,${EXTEN},${UNIQUEID})
 same => n,GotoIf($["${VB_STATUS}" = "ok"]?vbdone)
 same => n,Set(WAITCOUNT=$[${WAITCOUNT} + 1])
 same => n,GotoIf($[${WAITCOUNT} > 7]?vbtimeout)
 same => n,Goto(vbloop)
 same => n(vbtimeout),Playback(custom/timeout)
 same => n,Hangup()
 same => n(vbdone),Playback(custom/${VB_REPLY})
 same => n,Hangup()

exten => h,1,NoOp(Call ${UNIQUEID} ended: hangupcause=${HANGUPCAUSE})