[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
; Docker Desktop NAT: tell Zoiper (on the Windows host) to send RTP to the
; host LAN IP (published UDP 10000-10100 forwards into the container).
local_net=172.16.0.0/12
external_media_address=10.0.58.165
 
; --- Company A: extension 1001 ---
[1001]
type=endpoint
context=incoming-calls
disallow=all
allow=ulaw
allow=alaw
rtp_symmetric=yes
direct_media=no
auth=auth1001
aors=1001
 
[auth1001]
type=auth
auth_type=userpass
username=1001
password=changeme1001
 
[1001]
type=aor
max_contacts=1
 
; --- Company B: extension 1002 ---
[1002]
type=endpoint
context=incoming-calls
disallow=all
allow=ulaw
allow=alaw
rtp_symmetric=yes
direct_media=no
auth=auth1002
aors=1002
 
[auth1002]
